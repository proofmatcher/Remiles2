<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Remiles">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Google Sign-In Client ID for web -->
  <meta name="google-signin-client_id" content="60865903848-qufrm62v42k4kuh30jr022dr2mjcim5i.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Remiles</title>
  <link rel="manifest" href="manifest.json">

  <!-- Hide reCAPTCHA badge -->
  <style>
    .grecaptcha-badge { 
      visibility: hidden !important; 
      opacity: 0 !important;
      display: none !important;
    }
    #recaptcha-container {
      display: none;
    }
  </style>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAOZKD90SxW5dwOZVEe-nCm8dA6jXs-5AQ"></script>
</head>

<body>
  <!-- reCAPTCHA container for phone authentication -->
  <div id="recaptcha-container"></div>
  <script>
    window.addEventListener('load', function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "{{flutter_service_worker_version}}",
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

</html>
